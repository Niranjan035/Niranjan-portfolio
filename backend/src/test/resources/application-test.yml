# =============================================================================
# Test profile. Overrides every external dependency so the suite runs offline
# with no MySQL and no SMTP account. Mail is disabled; mail behaviour is covered
# by unit tests that mock JavaMailSender.
# =============================================================================

spring:
  datasource:
    url: jdbc:h2:mem:portfolio;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: false

  mail:
    host: localhost
    port: 3025

app:
  contact:
    receiver-email: niranjanhiremath11@gmail.com
    from-name: Portfolio
    mail-enabled: false
    rate-limit-max-requests: 3
    rate-limit-window-minutes: 10
    allowed-origins: http://localhost:5173

management:
  health:
    mail:
      enabled: false
