<!doctype html>

    <meta name="theme-color" content="#0D1117" />

    <!--
      Baseline metadata. The SPA then overrides <title>, description, canonical
      and Open Graph tags per route via src/components/Seo.tsx.
      Do not add a fake social preview image here.
    -->
    <title>Niranjan Hiremath | Software Developer &amp; Full-Stack Developer</title>
    <meta
      name="description"

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Niranjan Hiremath" />
    <meta property="og:title" content="Niranjan Hiremath | Software Developer &amp; Full-Stack Developer" />

      property="og:description"
      content="Portfolio of Niranjan Hiremath, a Software Developer and Full-Stack Developer."

    <meta property="og:image" content="" />
    <meta property="og:image:width" content="1200" />

    -->

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Niranjan Hiremath | Software Developer &amp; Full-Stack Developer" />

      name="twitter:description"
      content="Portfolio of Niranjan Hiremath, a Software Developer and Full-Stack Developer."
